<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MarbleMaze Controller</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0d1117;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 24px;
      margin: 20px auto;
      max-width: 380px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    }
    h2 { color: #58a6ff; margin-bottom: 5px; }
    button {
      background-color: #238636;
      color: #ffffff;
      font-size: 18px;
      font-weight: bold;
      padding: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      width: 100%;
      margin-top: 15px;
    }
    button:active { background-color: #2ea043; }
    .status { font-size: 16px; margin-top: 15px; color: #d29922; }
    .data { font-size: 20px; font-weight: bold; margin-top: 15px; color: #58a6ff; }
  </style>
</head>
<body>

  <h2>MarbleMaze</h2>
  <p style="font-size: 13px; color: #8b949e; margin-top: 0;">Phone Motion Controller</p>

  <div class="card">
    <button onclick="connectBLE()">CONNECT MARBLEMAZE</button>
    <div id="status" class="status">Status: Disconnected</div>
    <div id="data" class="data">Pitch: 0.0° | Roll: 0.0°</div>
  </div>

<script>
const SERVICE_UUID = "4fa86011-0053-4939-b157-578749c20001";
const CHAR_UUID    = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

let tiltChar = null;
let latestPitch = 0;
let latestRoll = 0;
let lastSentPitch = 0;
let lastSentRoll = 0;
let sendInterval = null;

async function connectBLE() {
  const statusElem = document.getElementById('status');
  try {
    statusElem.innerText = "Scanning for MarbleMaze...";

    // Request device accepting all devices or filtering by service
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [SERVICE_UUID]
    });

    statusElem.innerText = "Connecting to " + (device.name || "MarbleMaze") + "...";
    const server = await device.gatt.connect();
    
    statusElem.innerText = "Getting Service...";
    const service = await server.getPrimaryService(SERVICE_UUID);
    
    statusElem.innerText = "Getting Characteristic...";
    tiltChar = await service.getCharacteristic(CHAR_UUID);

    statusElem.innerText = "Status: CONNECTED";
    statusElem.style.color = "#3fb950";

    // Request orientation permission for iOS
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      await DeviceOrientationEvent.requestPermission();
    }

    window.addEventListener('deviceorientation', handleSensorData, true);

    if (sendInterval) clearInterval(sendInterval);
    sendInterval = setInterval(sendBLEData, 20); // 50Hz update loop

  } catch (err) {
    statusElem.innerText = "Error: " + err.message;
    statusElem.style.color = "#f85149";
  }
}

function handleSensorData(event) {
  latestPitch = event.beta || 0;
  latestRoll  = event.gamma || 0;
}

function sendBLEData() {
  if (!tiltChar) return;

  let pitch = Math.round(latestPitch * 10) / 10;
  let roll  = Math.round(latestRoll * 10) / 10;

  document.getElementById('data').innerText = `Pitch: ${pitch.toFixed(1)}° | Roll: ${roll.toFixed(1)}°`;

  if (Math.abs(pitch - lastSentPitch) >= 0.4 || Math.abs(roll - lastSentRoll) >= 0.4) {
    lastSentPitch = pitch;
    lastSentRoll  = roll;

    let buffer = new ArrayBuffer(8);
    let view = new DataView(buffer);
    view.setFloat32(0, pitch, true);
    view.setFloat32(4, roll, true);

    tiltChar.writeValueWithoutResponse(buffer).catch(() => {});
  }
}
</script>
</body>
</html>
