<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Race Tilt Controller</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      margin: 20px auto;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    button {
      background-color: #00e676;
      color: #000;
      font-size: 18px;
      font-weight: bold;
      padding: 16px 32px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    button:active { background-color: #00c853; }
    .status { font-size: 18px; margin-top: 15px; color: #ffab00; }
    .data { font-size: 22px; font-weight: bold; margin-top: 15px; color: #00e0ff; }
    .indicator {
      width: 40px; height: 40px; border-radius: 50%;
      background-color: #333; margin: 15px auto;
      border: 2px solid #555;
    }
    .indicator.active { background-color: #ff1744; box-shadow: 0 0 15px #ff1744; }
  </style>
</head>
<body>

  <h2>ESP32 Motion Controller</h2>

  <div class="card">
    <button onclick="connectBLE()">CONNECT ESP32</button>
    <div id="status" class="status">Status: Disconnected</div>
    <div id="data" class="data">Pitch: 0° | Roll: 0°</div>
    <div id="ledIndicator" class="indicator"></div>
    <p style="font-size: 12px; color: #888;">LED indicator lights up when tilt > ±20°</p>
  </div>

<script>
const SERVICE_UUID = "4fa86011-0053-4939-b157-578749c20001";
const CHAR_UUID    = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

let tiltChar = null;
let latestPitch = 0;
let latestRoll = 0;
let lastSentRoll = 0;
let sendInterval = null;

async function connectBLE() {
  const statusElem = document.getElementById('status');
  try {
    statusElem.innerText = "Scanning for ESP32...";

    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [SERVICE_UUID]
    });

    statusElem.innerText = "Connecting to " + device.name + "...";
    const server = await device.gatt.connect();
    
    statusElem.innerText = "Getting Service...";
    const service = await server.getPrimaryService(SERVICE_UUID);
    
    statusElem.innerText = "Getting Characteristic...";
    tiltChar = await service.getCharacteristic(CHAR_UUID);

    statusElem.innerText = "Status: CONNECTED";
    statusElem.style.color = "#00e676";

    // iOS Orientation Permission
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      await DeviceOrientationEvent.requestPermission();
    }

    // Event listener ONLY updates variables (does not send BLE data directly)
    window.addEventListener('deviceorientation', handleSensorData, true);

    // Start fixed 50Hz BLE transmit loop (20ms) to kill BLE queue delay
    if (sendInterval) clearInterval(sendInterval);
    sendInterval = setInterval(sendBLEData, 20);

  } catch (err) {
    statusElem.innerText = "Error: " + err.message;
    statusElem.style.color = "#ff1744";
  }
}

function handleSensorData(event) {
  latestPitch = event.beta || 0;
  latestRoll  = event.gamma || 0;
}

function sendBLEData() {
  if (!tiltChar) return;

  // Round values to 1 decimal place to eliminate raw sensor noise
  let pitch = Math.round(latestPitch * 10) / 10;
  let roll  = Math.round(latestRoll * 10) / 10;

  document.getElementById('data').innerText = `Pitch: ${pitch.toFixed(1)}° | Roll: ${roll.toFixed(1)}°`;

  const indicator = document.getElementById('ledIndicator');
  if (pitch > 20 || pitch < -20 || roll > 20 || roll < -20) {
    indicator.classList.add('active');
  } else {
    indicator.classList.remove('active');
  }

  // Only send packet if roll changed by more than 0.5° (Deadband filter)
  if (Math.abs(roll - lastSentRoll) >= 0.5) {
    lastSentRoll = roll;

    let buffer = new ArrayBuffer(8);
    let view = new DataView(buffer);
    view.setFloat32(0, pitch, true);
    view.setFloat32(4, roll, true);

    // Send without response
    tiltChar.writeValueWithoutResponse(buffer).catch(() => {});
  }
}
</script>
</body>
</html>
