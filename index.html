<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ESP32 Race Tilt Controller</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #121212;
      color: #ffffff;
      text-align: center;
      padding: 20px;
      margin: 0;
    }
    .card {
      background: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      margin: 20px auto;
      max-width: 400px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }
    button {
      background-color: #00e676;
      color: #000;
      font-size: 18px;
      font-weight: bold;
      padding: 16px 32px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }
    button:active { background-color: #00c853; }
    .status { font-size: 18px; margin-top: 15px; color: #ffab00; }
    .data { font-size: 22px; font-weight: bold; margin-top: 15px; color: #00e0ff; }
    .indicator {
      width: 40px; height: 40px; border-radius: 50%;
      background-color: #333; margin: 15px auto;
      border: 2px solid #555;
    }
    .indicator.active { background-color: #ff1744; box-shadow: 0 0 15px #ff1744; }
  </style>
</head>
<body>

  <h2>ESP32 Motion Controller</h2>

  <div class="card">
    <button onclick="connectBLE()">CONNECT ESP32</button>
    <div id="status" class="status">Status: Disconnected</div>
    <div id="data" class="data">Pitch: 0° | Roll: 0°</div>
    <div id="ledIndicator" class="indicator"></div>
    <p style="font-size: 12px; color: #888;">LED indicator lights up when tilt > ±20°</p>
  </div>

<script>
const SERVICE_UUID = "4fa86011-0053-4939-b157-578749c20001";
const CHAR_UUID    = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
let tiltChar = null;

async function connectBLE() {
  const statusElem = document.getElementById('status');
  try {
    statusElem.innerText = "Scanning for ESP32...";

    // Uses acceptAllDevices to ensure ESP32 appears on all phones
    const device = await navigator.bluetooth.requestDevice({
      acceptAllDevices: true,
      optionalServices: [SERVICE_UUID]
    });

    statusElem.innerText = "Connecting to " + device.name + "...";
    const server = await device.gatt.connect();
    
    statusElem.innerText = "Getting Service...";
    const service = await server.getPrimaryService(SERVICE_UUID);
    
    statusElem.innerText = "Getting Characteristic...";
    tiltChar = await service.getCharacteristic(CHAR_UUID);

    statusElem.innerText = "Status: CONNECTED";
    statusElem.style.color = "#00e676";

    // Request iOS device orientation permissions
    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      await DeviceOrientationEvent.requestPermission();
    }

    // Capture sensor data at high frequency
    window.addEventListener('deviceorientation', handleOrientation, true);

  } catch (err) {
    statusElem.innerText = "Error: " + err.message;
    statusElem.style.color = "#ff1744";
  }
}

function handleOrientation(event) {
  if (!tiltChar) return;

  let pitch = event.beta || 0;  // Front/Back tilt (-180 to 180)
  let roll  = event.gamma || 0; // Left/Right tilt (-90 to 90)

  document.getElementById('data').innerText = `Pitch: ${pitch.toFixed(1)}° | Roll: ${roll.toFixed(1)}°`;

  // UI Indicator logic
  const indicator = document.getElementById('ledIndicator');
  if (pitch > 20 || pitch < -20 || roll > 20 || roll < -20) {
    indicator.classList.add('active');
  } else {
    indicator.classList.remove('active');
  }

  // Pack two 32-bit floats (8 bytes) into binary array
  let buffer = new ArrayBuffer(8);
  let view = new DataView(buffer);
  view.setFloat32(0, pitch, true); // Little-Endian
  view.setFloat32(4, roll, true);  // Little-Endian

  // Send over BLE without response (sub-10ms speed)
  tiltChar.writeValueWithoutResponse(buffer);
}
</script>
</body>
</html>
